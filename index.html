<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSW24 Scrabble 2-4 letters word Quiz</title>
    <style>
        :root {
            --primary: #1e3799; --accent: #eb2f06; --tile: #f39c12;
            --success: #10ac84; --error: #ee5253; --dark: #2f3542;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f2f6; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 650px; }
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .sub-head { text-align: center; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 25px; }
        .hidden { display: none; }

        .setup-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 1rem; }

        .tile-container { display: flex; gap: 10px; justify-content: center; margin: 25px 0; min-height: 60px; }
        .tile { 
            width: 55px; height: 55px; background: var(--tile); color: white; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1.6rem; border-radius: 6px; cursor: pointer;
            box-shadow: 0 5px 0 #d35400; transition: 0.1s; user-select: none;
        }
        .tile.used { opacity: 0.2; pointer-events: none; transform: translateY(3px); box-shadow: none; }

        .answer-box { border-bottom: 4px solid var(--dark); height: 60px; font-size: 2.5rem; text-align: center; letter-spacing: 8px; margin-bottom: 20px; text-transform: uppercase; font-weight: bold; }

        .found-words { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #b2bec3; min-height: 45px; }
        .found-tag { display: inline-block; background: var(--primary); color: white; padding: 6px 14px; border-radius: 4px; margin: 4px; font-size: 0.9rem; font-weight: bold; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 1rem; transition: 0.2s; }
        .btn-add { background: var(--success); }
        .btn-clear { background: #636e72; }
        .btn-invalid { background: var(--accent); }
        .btn-final { background: var(--dark); grid-column: span 2; margin-top: 10px; }
        .btn-start { background: var(--primary); width: 100%; font-size: 1.1rem; }

        .review-item { padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 2px solid #eee; }
        .correct { border-color: var(--success); background: #f3fcf9; }
        .wrong { border-color: var(--error); background: #fffcfc; }
    </style>
</head>
<body>

<div class="container">
    <h1>CSW24 2-4 letters-word Trainer</h1>
    <div class="sub-head">Focused on 2, 3, and 4-Letter Words</div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <div class="setup-group">
            <label>Word Length</label>
            <select id="word-length">
                <option value="2">2 Letters (Master the basics)</option>
                <option value="3">3 Letters</option>
                <option value="4">4 Letters</option>
            </select>
        </div>
        <div class="setup-group">
            <label>Number of Questions</label>
            <input type="number" id="quiz-count" value="5" min="1" max="20">
        </div>
        <button class="btn-start" onclick="startQuiz()">Start NZ Quiz</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--primary);">
            <span>LENGTH: <span id="stat-len"></span></span>
            <span># <span id="current-idx"></span> / <span id="total-idx"></span></span>
        </div>
        
        <div class="tile-container" id="tile-rack"></div>
        <div class="answer-box" id="answer-display"></div>
        
        <div class="found-words"><div id="found-list"></div></div>
        
        <div class="controls">
            <button class="btn-clear" onclick="clearAnswer()">RESET</button>
            <button class="btn-add" onclick="addWord()">ADD</button>
            <button class="btn-invalid" onclick="markInvalid()">NO WORDS</button>
            <button class="btn-final" onclick="finalizeQuestion()">SUBMIT & NEXT</button>
        </div>
    </div>

    <!-- REVIEW SCREEN -->
    <div id="review-screen" class="hidden">
        <h2 style="text-align: center;">Results</h2>
        <div id="review-list"></div>
        <button class="btn-start" onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>

        3: ["AAH","AAL","AAS","ABA","ABB","ABS","ABY","ACE","ACH","ACK","ACT","ADD","ADO","ADS","ADZ","AFF","AFT","AGA","AGE","AGO","AGS","AHA","AHI","AHS","AID","AIL","AIM","AIN","AIR","AIS","AIT","AJI","AKA","AKE","ALA","ALB","ALE","ALF","ALL","ALP","ALS","ALT","AMA","AME","AMI","AMP","AMU","ANA","AND","ANE","ANI","ANN","ANS","ANT","ANY","APE","APO","APP","APT","ARB","ARC","ARD","ARE","ARF","ARK","ARM","ARS","ART","ARY","ASH","ASK","ASP","ASS","ATE","ATT","AUA","AUE","AUF","AUK","AVA","AVE","AVO","AWA","AWE","AWL","AWN","AXE","AYE","AYS","AYU","AZO","BAA","BAC","BAD","BAE","BAG","BAH","BAL","BAM","BAN","BAO","BAP","BAR","BAS","BAT","BAY","BED","BEE","BEG","BEL","BEN","BES","BET","BEY","BEZ","BIB","BID","BIG","BIN","BIO","BIS","BIT","BIZ","BOA","BOB","BOD","BOG","BOH","BOI","BOK","BON","BOO","BOP","BOR","BOS","BOT","BOW","BOX","BOY","BRA","BRO","BRR","BRU","BUB","BUD","BUG","BUM","BUN","BUR","BUS","BUT","BUY","BYE","BYS","CAA","CAB","CAD","CAF","CAG","CAI","CAL","CAM","CAN","CAP","CAR","CAT","CAW","CAY","CAZ","CEE","CEL","CEP","CHA","CHE","CHI","CHZ","CID","CIG","CIS","CIT","CLY","COB","COD","COG","COL","CON","COO","COP","COR","COS","COT","COW","COX","COY","COZ","CRU","CRY","CUB","CUD","CUE","CUM","CUP","CUR","CUT","CUZ","CWM","DAB","DAD","DAE","DAG","DAH","DAK","DAL","DAM","DAN","DAP","DAS","DAW","DAY","DEB","DEE","DEF","DEG","DEI","DEL","DEN","DEP","DEV","DEW","DEY","DIB","DID","DIE","DIF","DIG","DIM","DIN","DIP","DIS","DIT","DIV","DIX","DIY","DZO","EAD","EAN","EAR","EAS","EAT","EAU","EBB","ECH","ECO","ECU","EDH","EDS","EEK","EEL","EEN","EEW","EFF","EFS","EFT","EGG","EGO","EHS","EIK","EKE","ELD","ELF","ELK","ELL","ELM","ELS","ELT","EME","EMO","EMS","EMU","END","ENE","ENG","ENS","EON","ERA","ERE","ERF","ERG","ERK","ERM","ERN","ERR","ERS","ESS","EST","ETA","ETH","EUA","EUK","EVE","EVO","EWE","EWK","EWT","EXO","FAC","FAD","FAE","FAG","FAH","FAI","FAN","FAP","FAR","FAS","FAT","FAW","FAX","FAY","FED","FEE","FEG","FEH","FEM","FEN","FER","FES","FET","FEU","FEW","FEY","F "SAZ","SEA","SEC","SED","SEE","SEG","SEI","SEL","SEN","SER","SET","SEV","SEW","SEX","SEY","SEZ","SHA","SHE","SHH","SHY","SIB","SIC","SIM","SIN","SIP","SIR","SIS","SIT","SIX","SKA","SKI","SKY","SLY","SMA","SNY","SOB","SOC","SOD","SOG","SOH","SOL","SOM","SON","SOP","SOS","SOT","SOU","SOW","SOX","SOZ","SPA","SPY","SRI","STY","SUB","SUD","SUE","SUI","SUK","SUM","SUN","SUP","SUQ","SUR","SUS","SWY","SYE","SYN","TAB","TAD","TAE","TAG","TAI","TAJ","TAK","TAM","TAN","TAO","TAP","TAR","TAS","TAT","TAU","TAV","TAW","TAX","TAY","TEA","TEC","TED","TEE","TEF","TEG","TEH","TEL","TEN","TET","TEW","TEX","THE","THO","THY","TIC","TID","TIE","TIG","TIK","TIL","TIN","TIP","TIS","TIT","TIX","TIZ","TOD","TOE","TOG","TOM","TON","TOO","TOP","TOR","TOT","TOW","TOX","TOY","TRY","TSK","TUA","TUB","TUG","TUI","TUM","TUN","TUP","TUX","TWA","TWO","TWP","TYE","TYG","UDO","UDS","UEY","UFO","UGH","UGS","UKE","ULE","ULU","UMA","UME","UMM","UMP","UMU","UNB","UNC","UNI","UNS","UPO","UPS","URB","URD","URE","URN","URP","USE","UTA","UTE","UTS","UTU","UVA","VAC","VAE","VAG","VAN","VAR","VAS","VAT","VAU","VAV","VAW","VEE","VEG","VET","VEX","VIA","VID","VIE","VIG","VIM","VIN","VIS","VLY","VOE","VOL","VOR","VOW","VOX","VUG","VUM","WAB","WAD","WAE","WAG","WAI","WAK","WAN","WAP","WAR","WAS","WAT","WAW","WAX","WAY","WAZ","WEB","WED","WEE","WEM","WEN","WET","WEX","WEY","WHA","WHO","WHY","WIG","WIN","WIS","WIT","WIZ","WOE","WOF","WOK","WON","WOO","WOP","WOS","WOT","WOW","WOX","WRY","WUD","WUS","WYE","WYN","XED","XIS","XUX","XYL","YAD","YAE","YAG","YAH","YAK","YAM","YAN","YAP","YAR","YAW","YAY","YEA","YEH","YEN","YEP","YER","YES","YET","YEW","YEX","YEY","YEZ","YGO","YID","YIN","YIP","YOB","YOD","YOK","YOM","YON","YOU","YOW","YUG","YUK","YUL","YUM","YUP","YUR","YUS","YUT","ZAD","ZAG","ZAP","ZAS","ZAX","ZEA","ZED","ZEE","ZEK","ZEL","ZEN","ZEP","ZEX","ZHO","ZIG","ZIN","ZIP","ZIT","ZIZ","ZOA","ZOL","ZOO","ZOS","ZUZ","ZZZ"]
    };

    let quizPool = [];
    let currentQuestion = 0;
    let userResults = [];
    let currentInput = "";
    let currentSessionWords = [];

    function startQuiz() {
        const length = parseInt(document.getElementById('word-length').value);
        let count = parseInt(document.getElementById('quiz-count').value);
        
        // Load Dictionary (Using Sample 4s if length is 4 since bank is huge)
        let list = NZ_CSW24_BANK[length] || [];
        
        // For length 4, we group what we have in memory
        if (length === 4) {
            // Note: In a production app, the full 4L list is ~6000 words.
            // Here we provide common high-probability NZ study words.
            list = ["AAHS","AALS","ABAC","ABAS","ABBA","ABBE","ABBS","ABED","ABER","ABET","ABID","ABLE","ABLY","ABRI","ABUT","ABYE","ABYS","ACAI","ACAS","ACED","ACER","ACES","ACHE","ACHY","ACID","ACME","ACNE","ACRE","ACTA","ACTS","QIIS","ZZZS","ZYME","YUKY","XRAY","WATT"];
        }

        const groups = {};
        list.forEach(word => {
            const key = word.split('').sort().join('');
            if (!groups[key]) groups[key] = [];
            groups[key].push(word);
        });

        let keys = Object.keys(groups).sort(() => Math.random() - 0.5);
        const actualCount = Math.min(count, keys.length);

        quizPool = [];
        for (let i = 0; i < actualCount; i++) {
            quizPool.push({
                tiles: keys[i].split('').sort(() => Math.random() - 0.5),
                validSolutions: groups[keys[i]]
            });
        }

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('stat-len').innerText = length;
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizPool[currentQuestion];
        document.getElementById('current-idx').innerText = currentQuestion + 1;
        document.getElementById('total-idx').innerText = quizPool.length;
        document.getElementById('found-list').innerHTML = '';
        currentSessionWords = [];
        clearAnswer();
        renderTiles();
    }

    function renderTiles() {
        const rack = document.getElementById('tile-rack');
        rack.innerHTML = '';
        quizPool[currentQuestion].tiles.forEach((letter) => {
            const div = document.createElement('div');
            div.className = 'tile';
            div.innerText = letter;
            div.onclick = function() {
                if(!this.classList.contains('used')) {
                    currentInput += letter;
                    this.classList.add('used');
                    document.getElementById('answer-display').innerText = currentInput;
                }
            };
            rack.appendChild(div);
        });
    }

    function clearAnswer() {
        currentInput = "";
        document.getElementById('answer-display').innerText = "";
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
    }

    function addWord() {
        if (!currentInput) return;
        if (!currentSessionWords.includes(currentInput)) {
            currentSessionWords.push(currentInput);
            const span = document.createElement('span');
            span.className = 'found-tag';
            span.innerText = currentInput;
            document.getElementById('found-list').appendChild(span);
        }
        clearAnswer();
    }

    function markInvalid() {
        currentSessionWords = [];
        finalizeQuestion();
    }

    function finalizeQuestion() {
        const q = quizPool[currentQuestion];
        const sol = [...q.validSolutions].sort();
        const usr = [...currentSessionWords].sort();
        const isCorrect = JSON.stringify(sol) === JSON.stringify(usr);

        userResults.push({
            tiles: q.tiles.join(''),
            userWords: [...currentSessionWords],
            allSolutions: q.validSolutions,
            success: isCorrect
        });

        currentQuestion++;
        if (currentQuestion < quizPool.length) loadQuestion();
        else showReview();
    }

    function showReview() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('review-screen').classList.remove('hidden');
        const list = document.getElementById('review-list');
        list.innerHTML = "";
        
        userResults.forEach((res, i) => {
            const div = document.createElement('div');
            div.className = `review-item ${res.success ? 'correct' : 'wrong'}`;
            div.innerHTML = `
                <strong>#${i+1} [${res.tiles}]</strong> ${res.success ? '✓' : '✗'}<br>
                Added: ${res.userWords.join(', ') || 'None'}<br>
                CSW24 Words: <b style="color:var(--primary)">${res.allSolutions.join(', ')}</b>
            `;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
