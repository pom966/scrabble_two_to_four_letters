<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSW24 Expert Quiz</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --tile: #f39c12;
            --success: #27ae60;
            --error: #e74c3c;
            --dark: #34495e;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #dfe6e9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        h1 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }

        .setup-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }

        .tile-container { display: flex; gap: 10px; justify-content: center; margin: 20px 0; min-height: 60px; }
        .tile { 
            width: 50px; height: 50px; background: var(--tile); color: white; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1.5rem; border-radius: 5px; cursor: pointer;
            box-shadow: 0 4px 0 #d35400; transition: transform 0.1s;
        }
        .tile.used { opacity: 0.3; pointer-events: none; }

        .answer-box { 
            border-bottom: 3px solid var(--dark); height: 50px; 
            font-size: 2rem; text-align: center; letter-spacing: 4px; margin-bottom: 20px;
            text-transform: uppercase; font-weight: bold; color: var(--dark);
        }

        .found-words { 
            background: #f1f2f6; padding: 15px; border-radius: 8px; 
            margin-bottom: 20px; min-height: 50px; border: 1px solid #ced4da;
        }
        .found-tag { 
            display: inline-block; background: var(--dark); color: white; 
            padding: 5px 12px; border-radius: 20px; margin: 4px; font-size: 0.9rem;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { 
            padding: 14px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: bold; color: white; font-size: 1rem;
        }
        .btn-add { background: var(--success); }
        .btn-clear { background: #95a5a6; }
        .btn-invalid { background: var(--error); }
        .btn-final { background: var(--accent); grid-column: span 2; margin-top: 10px; }
        .btn-start { background: var(--dark); width: 100%; margin-top: 10px; }

        .review-item { padding: 15px; border-bottom: 1px solid #eee; margin-bottom: 10px; border-radius: 5px; }
        .correct { background: #eafff0; border-left: 5px solid var(--success); }
        .wrong { background: #fff5f5; border-left: 5px solid var(--error); }
    </style>
</head>
<body>

<div class="container">
    <h1>CSW24 Expert</h1>

    <div id="setup-screen">
        <div class="setup-group">
            <label>Word Length</label>
            <select id="word-length">
                <option value="3">3 Letters</option>
                <option value="4">4 Letters</option>
            </select>
        </div>
        <div class="setup-group">
            <label>Questions</label>
            <input type="number" id="quiz-count" value="5" min="1">
        </div>
        <button class="btn-start" onclick="startQuiz()">Begin Quiz</button>
    </div>

    <div id="game-screen" class="hidden">
        <p style="text-align: center; font-weight: bold;">Question <span id="current-idx">1</span> / <span id="total-idx">5</span></p>
        
        <div class="tile-container" id="tile-rack"></div>
        <div class="answer-box" id="answer-display"></div>
        
        <div class="found-words">
            <small>Submitted for this round:</small><br>
            <div id="found-list"></div>
        </div>
        
        <div class="controls">
            <button class="btn-clear" onclick="clearAnswer()">Clear Tiles</button>
            <button class="btn-add" onclick="addWord()">Add Word</button>
            <button class="btn-invalid" onclick="markInvalid()">No Words Exist</button>
            <button class="btn-final" onclick="finalizeQuestion()">Finalize Answer</button>
        </div>
    </div>

    <div id="review-screen" class="hidden">
        <h2>Review Results</h2>
        <div id="review-list"></div>
        <button class="btn-start" onclick="location.reload()">New Quiz</button>
    </div>
</div>

<script>
    // Sample Word Bank - Add more CSW24 words here
    const CSW24_FULL = ["ACT", "CAT", "ATE", "EAT", "TEA", "ETA", "DOG", "GOD", "EARS", "ERAS", "SEAR", "OPTS", "POST", "STOP", "POTS", "TOPS", "AREAS", "ABED", "BADE", "BEAD"];

    let quizPool = [];
    let currentQuestion = 0;
    let userResults = [];
    let currentInput = "";
    let currentSessionWords = [];

    function startQuiz() {
        const length = parseInt(document.getElementById('word-length').value);
        const count = parseInt(document.getElementById('quiz-count').value);
        
        // Group by anagrams
        const groups = {};
        CSW24_FULL.filter(w => w.length === length).forEach(word => {
            const key = word.split('').sort().join('');
            if (!groups[key]) groups[key] = [];
            groups[key].push(word);
        });

        // Convert to array and shuffle to prevent repeats
        let keys = Object.keys(groups).sort(() => Math.random() - 0.5);
        
        quizPool = [];
        for (let i = 0; i < Math.min(count, keys.length); i++) {
            quizPool.push({
                tiles: keys[i].split('').sort(() => Math.random() - 0.5),
                validSolutions: groups[keys[i]]
            });
        }

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizPool[currentQuestion];
        document.getElementById('current-idx').innerText = currentQuestion + 1;
        document.getElementById('total-idx').innerText = quizPool.length;
        document.getElementById('found-list').innerHTML = '';
        currentSessionWords = [];
        clearAnswer();
        renderTiles();
    }

    function renderTiles() {
        const rack = document.getElementById('tile-rack');
        rack.innerHTML = '';
        quizPool[currentQuestion].tiles.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'tile';
            div.innerText = letter;
            div.onclick = () => {
                currentInput += letter;
                div.classList.add('used');
                document.getElementById('answer-display').innerText = currentInput;
            };
            rack.appendChild(div);
        });
    }

    function clearAnswer() {
        currentInput = "";
        document.getElementById('answer-display').innerText = "";
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
    }

    function addWord() {
        if (currentInput.length === 0) return;
        
        if (!currentSessionWords.includes(currentInput)) {
            currentSessionWords.push(currentInput);
            const span = document.createElement('span');
            span.className = 'found-tag';
            span.innerText = currentInput;
            document.getElementById('found-list').appendChild(span);
        }
        clearAnswer();
    }

    function markInvalid() {
        currentSessionWords = []; // Represents user claiming no words exist
        finalizeQuestion();
    }

    function finalizeQuestion() {
        const q = quizPool[currentQuestion];
        
        // Check if user found EXACTLY the same words as the solution
        const userSorted = [...currentSessionWords].sort();
        const solutionSorted = [...q.validSolutions].sort();
        const isCorrect = JSON.stringify(userSorted) === JSON.stringify(solutionSorted);

        userResults.push({
            tiles: q.tiles.join(''),
            userWords: currentSessionWords,
            allSolutions: q.validSolutions,
            success: isCorrect
        });

        currentQuestion++;
        if (currentQuestion < quizPool.length) {
            loadQuestion();
        } else {
            showReview();
        }
    }

    function showReview() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('review-screen').classList.remove('hidden');
        const list = document.getElementById('review-list');
        
        userResults.forEach((res, i) => {
            const div = document.createElement('div');
            div.className = `review-item ${res.success ? 'correct' : 'wrong'}`;
            div.innerHTML = `
                <strong>Q${i+1}: Tiles [${res.tiles}]</strong><br>
                Your entry: ${res.userWords.join(', ') || 'None'}<br>
                <span style="color: #2c3e50">CSW24 Solutions: <b>${res.allSolutions.join(', ')}</b></span>
            `;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
