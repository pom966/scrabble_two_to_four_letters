<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSW24 Scrabble 2-4 Letters-Word Trainer</title>
    <style>
        :root { --primary: #0984e3; --dark: #2d3436; --tile: #ffeaa7; --success: #00b894; --fail: #d63031; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f2f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin: 0; color: var(--dark); font-size: 1.4rem; }
        .sub { text-align: center; font-size: 0.8rem; color: #636e72; margin-bottom: 20px; }
        
        .rack { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 60px; }
        .tile { 
            width: 50px; height: 50px; background: var(--tile); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 4px 0 #fab1a0; border: 1px solid #e17055; user-select: none;
        }
        .tile.used { opacity: 0.2; pointer-events: none; transform: translateY(2px); box-shadow: none; }
        
        .input-display { border-bottom: 3px solid var(--dark); height: 45px; text-align: center; font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .found-area { background: #f9f9f9; padding: 10px; border-radius: 8px; min-height: 40px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 5px; border: 1px solid #eee; }
        .word-tag { background: var(--dark); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-clear { background: #dfe6e9; color: var(--dark); }
        .btn-add { background: var(--success); color: white; }
        .btn-none { background: var(--fail); color: white; }
        .btn-next { background: var(--primary); color: white; grid-column: span 2; margin-top: 5px; }

        .res-box { margin-top: 15px; padding: 10px; border-radius: 8px; border-left: 4px solid #ccc; font-size: 0.9rem; }
        .res-ok { border-color: var(--success); background: #e6fffb; }
        .res-err { border-color: var(--fail); background: #fff1f0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>CSW24 NZ Trainer</h1>
    <div class="sub">Official 2-4 Letter Word Master</div>

    <div id="setup">
        <label>Word Length:</label>
        <select id="size" style="width:100%; padding:10px; margin:10px 0;">
            <option value="2">2 Letters</option>
            <option value="3">3 Letters</option>
            <option value="4">4 Letters</option>
        </select>
        <button class="btn-next" onclick="start()">Begin Training</button>
    </div>

    <div id="game" class="hidden">
        <div id="prog" style="text-align:right; font-size:0.8rem; font-weight:bold; color:var(--primary);"></div>
        <div class="rack" id="rack"></div>
        <div class="input-display" id="entry"></div>
        <div class="found-area" id="found"></div>
        <div class="grid">
            <button class="btn-clear" onclick="resetInput()">Clear</button>
            <button class="btn-add" onclick="submitWord()">Add Word</button>
            <button class="btn-none" onclick="noWords()">No Words</button>
            <button class="btn-next" onclick="evaluate()">Finalize Anagrams</button>
        </div>
    </div>

    <div id="report" class="hidden">
        <h3>Results</h3>
        <div id="log"></div>
        <button class="btn-next" onclick="location.reload()">New Game</button>
    </div>
</div>

let game = { qs: [], current: 0, userWords: [], input: "", report: [] };

function parseList(raw) {
    const arr = raw.split(/\s+/);
    let g = {};
    arr.forEach(w => {
        let k = w.split('').sort().join('');
        if(!g[k]) g[k] = [];
        if(!g[k].includes(w)) g[k].push(w);
    });
    return g;
}

function start() {
    const size = document.getElementById('size').value;
    const raw = size == "2" ? CSW24[2].join(' ') : (size == "3" ? CSW24.raw3 : CSW24.raw4);
    const groups = parseList(raw);
    
    let keys = Object.keys(groups).sort(() => Math.random() - 0.5).slice(0, 10);
    game.qs = keys.map(k => ({
        tiles: k.split('').sort(() => Math.random() - 0.5),
        ans: groups[k].sort()
    }));
    
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    loadQ();
}

function loadQ() {
    const q = game.qs[game.current];
    document.getElementById('prog').innerText = `Q: ${game.current + 1} / 10`;
    document.getElementById('found').innerHTML = "";
    document.getElementById('entry').innerText = "";
    game.userWords = [];
    game.input = "";
    
    const r = document.getElementById('rack');
    r.innerHTML = "";
    q.tiles.forEach(l => {
        const t = document.createElement('div');
        t.className = "tile";
        t.innerText = l;
        t.onclick = () => {
            if(!t.classList.contains('used')) {
                t.classList.add('used');
                game.input += l;
                document.getElementById('entry').innerText = game.input;
            }
        };
        r.appendChild(t);
    });
}

function resetInput() {
    game.input = "";
    document.getElementById('entry').innerText = "";
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
}

function submitWord() {
    if(game.input && !game.userWords.includes(game.input)) {
        game.userWords.push(game.input);
        const tag = document.createElement('div');
        tag.className = "word-tag";
        tag.innerText = game.input;
        document.getElementById('found').appendChild(tag);
    }
    resetInput();
}

function noWords() {
    game.userWords = [];
    evaluate();
}

function evaluate() {
    const q = game.qs[game.current];
    const ok = JSON.stringify(game.userWords.sort()) === JSON.stringify(q.ans.sort());
    
    game.report.push({
        t: q.tiles.join(''),
        u: game.userWords,
        a: q.ans,
        ok: ok
    });

    game.current++;
    if(game.current < 10) loadQ();
    else showReport();
}

function showReport() {
    document.getElementById('game').classList.add('hidden');
    document.getElementById('report').classList.remove('hidden');
    const log = document.getElementById('log');
    game.report.forEach(r => {
        const d = document.createElement('div');
        d.className = `res-box ${r.ok ? 'res-ok' : 'res-err'}`;
        d.innerHTML = `
            <strong>Tiles: ${r.t}</strong> - ${r.ok ? 'Correct' : 'Incorrect'}<br>
            Official: ${r.a.join(', ')}<br>
            Yours: ${r.u.join(', ') || 'None'}
        `;
        log.appendChild(d);
    });
}
