<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSW24 Trainer - Optimized</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f5f7fa; --text: #2c3e50; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-top: 0; color: var(--primary); }
        
        /* Game Elements */
        .rack { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; min-height: 50px; }
        .tile { width: 42px; height: 42px; background: #fdf6e3; border: 2px solid #d3af37; border-radius: 6px; 
                display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 1.2rem; transition: 0.1s; }
        .tile:active { transform: scale(0.9); }
        .tile.used { opacity: 0.2; pointer-events: none; background: #eee; border-color: #ccc; }
        
        .display-box { border-bottom: 3px solid var(--primary); height: 45px; font-size: 1.8rem; text-align: center; margin-bottom: 15px; letter-spacing: 2px; }
        .word-shelf { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; min-height: 30px; }
        .word-tag { background: #ecf0f1; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        
        /* UI Components */
        select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 1rem; }
        button { cursor: pointer; border: none; font-weight: bold; transition: background 0.2s; }
        .btn-go { background: var(--primary); color: white; }
        .btn-go:hover { background: #357abd; }
        .btn-add { background: #2ecc71; color: white; }
        .btn-clear { background: #e74c3c; color: white; }
        .hidden { display: none; }
        
        .result-item { padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 0.9rem; border-left: 4px solid #34495e; background: #fafafa; }
        .correct { border-color: #2ecc71; }
        .wrong { border-color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>CSW24 Anagrams</h2>

    <!-- Start Screen -->
    <div id="setup">
        <label>Word Length</label>
        <select id="lenSet">
            <option value="2">2 Letters</option>
            <option value="3">3 Letters</option>
            <option value="4">4 Letters</option>
        </select>
        <label>Number of Rounds</label>
        <select id="roundSet">
            <option value="5">5 Rounds</option>
            <option value="10" selected>10 Rounds</option>
            <option value="20">20 Rounds</option>
        </select>
        <button class="btn-go" onclick="GameModule.start()">START TRAINER</button>
    </div>

    <!-- Play Screen -->
    <div id="play" class="hidden">
        <div id="status" style="text-align: center; font-size: 0.8rem; margin-bottom: 10px; color: #7f8c8d;"></div>
        <div class="rack" id="rack"></div>
        <div class="display-box" id="currentWord"></div>
        <div class="word-shelf" id="shelf"></div>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn-clear" onclick="GameModule.clear()">Clear</button>
            <button class="btn-add" onclick="GameModule.add()">Enter</button>
        </div>
        <button class="btn-go" style="margin-top:10px; background:#9b59b6" onclick="GameModule.next()">SUBMIT ROUND</button>
    </div>

    <!-- End Screen -->
    <div id="end" class="hidden">
        <h3 id="finalScore" style="text-align:center"></h3>
        <div id="review"></div>
        <button class="btn-go" onclick="location.reload()">RESTART</button>
    </div>
</div>

/**
 * CORE GAME MODULE
 */
const GameModule = {
    state: { questions: [], currentIdx: 0, userWords: [], currentInput: "", score: 0, history: [] },

    start: function() {
        const size = document.getElementById('lenSet').value;
        const totalRounds = parseInt(document.getElementById('roundSet').value);
        
        // Build the dictionary for this session only (Performance!)
        const list = WordData.raw[size].split(' ');
        const map = new Map();
        
        list.forEach(word => {
            const key = word.split('').sort().join('');
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(word);
        });

        // Pick random unique anagram sets
        const keys = Array.from(map.keys()).sort(() => 0.5 - Math.random()).slice(0, totalRounds);
        
        this.state = {
            questions: keys.map(k => ({ alphagram: k, solutions: map.get(k) })),
            currentIdx: 0,
            userWords: [],
            currentInput: "",
            score: 0,
            history: []
        };

        document.getElementById('setup').classList.add('hidden');
        document.getElementById('play').classList.remove('hidden');
        this.loadRound();
    },

    loadRound: function() {
        const q = this.state.questions[this.state.currentIdx];
        this.state.userWords = [];
        this.state.currentInput = "";
        
        // Shuffle the letters for the rack
        const letters = q.alphagram.split('').sort(() => 0.5 - Math.random());
        
        document.getElementById('status').innerText = `Round ${this.state.currentIdx + 1} of ${this.state.questions.length}`;
        document.getElementById('shelf').innerHTML = "";
        document.getElementById('currentWord').innerText = "";
        
        const rackEl = document.getElementById('rack');
        rackEl.innerHTML = "";
        letters.forEach(L => {
            const div = document.createElement('div');
            div.className = "tile";
            div.innerText = L;
            div.onclick = (e) => this.pressTile(e.target, L);
            rackEl.appendChild(div);
        });
    },

    pressTile: function(el, letter) {
        if (!el.classList.contains('used')) {
            el.classList.add('used');
            this.state.currentInput += letter;
            document.getElementById('currentWord').innerText = this.state.currentInput;
        }
    },

    clear: function() {
        this.state.currentInput = "";
        document.getElementById('currentWord').innerText = "";
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
    },

    add: function() {
        const word = this.state.currentInput;
        if (word.length > 1 && !this.state.userWords.includes(word)) {
            this.state.userWords.push(word);
            const tag = document.createElement('div');
            tag.className = "word-tag";
            tag.innerText = word;
            document.getElementById('shelf').appendChild(tag);
        }
        this.clear();
    },

    next: function() {
        const q = this.state.questions[this.state.currentIdx];
        const user = [...this.state.userWords].sort();
        const solutions = [...q.solutions].sort();
        const isCorrect = JSON.stringify(user) === JSON.stringify(solutions);

        if (isCorrect) this.state.score++;

        this.state.history.push({
            letters: q.alphagram,
            user: user,
            solutions: solutions,
            passed: isCorrect
        });

        this.state.currentIdx++;
        if (this.state.currentIdx < this.state.questions.length) {
            this.loadRound();
        } else {
            this.finish();
        }
    },

    finish: function() {
        document.getElementById('play').classList.add('hidden');
        document.getElementById('end').classList.remove('hidden');
        document.getElementById('finalScore').innerText = `Result: ${this.state.score} / ${this.state.questions.length}`;
        
        const reviewEl = document.getElementById('review');
        reviewEl.innerHTML = "";
        this.state.history.forEach(item => {
            const div = document.createElement('div');
            div.className = `result-item ${item.passed ? 'correct' : 'wrong'}`;
            div.innerHTML = `
                <strong>Letters: ${item.letters}</strong><br>
                Solutions: ${item.solutions.join(', ')}<br>
                You found: ${item.user.join(', ') || 'None'}
            `;
            reviewEl.appendChild(div);
        });
    }
};
